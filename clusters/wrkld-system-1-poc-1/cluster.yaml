# Step 4b: the guest cluster. Commit this file; Argo CD applies it.
# Fill the CHANGE-ME values from the Step 4a lookup commands (see README.md).
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: wrkld-system-1-poc-1               # CLUSTER, same as the folder name
  namespace: system-1-ns-poc-1             # CLUSTER_NS
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["172.20.0.0/16"]       # must not overlap networks the cluster must reach
    services:
      cidrBlocks: ["172.21.0.0/16"]
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.8.0         # CHANGE-ME: from the cluster class list
      namespace: vmware-system-vks-public
    version: v1.37.1+vmware.4              # CHANGE-ME: from the version list, NO -vkr.N ending
    controlPlane:
      replicas: 1
    workers:
      machineDeployments:
      - class: node-pool
        name: np1
        replicas: 2
    variables:
    - name: vmClass
      value: best-effort-medium            # CHANGE-ME: from the VM class list
    - name: storageClass
      value: wcp-vmfs                      # CHANGE-ME: from the storage class list
    - name: vsphereOptions
      value:
        persistentVolumes:
          defaultStorageClass: wcp-vmfs    # CHANGE-ME: same storage class
