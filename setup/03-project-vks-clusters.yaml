# Allows only this repo, only the granted vSphere Namespaces listed below, and only Cluster objects.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vks-clusters
  namespace: system-1-argocd               # ARGOCD_NS
spec:
  sourceRepos:
  - https://github.com/northerntrust-internal/apm0005794-k8s-vks-optimation.git
  destinations:
  # One entry per granted vSphere Namespace (each needs its setup/02-rbac-<ns>.yaml applied).
  - name: system-1-ns-poc-1
    namespace: system-1-ns-poc-1
  - name: system-1-ns-poc-2
    namespace: system-1-ns-poc-2
  namespaceResourceWhitelist:
  - group: cluster.x-k8s.io
    kind: Cluster
