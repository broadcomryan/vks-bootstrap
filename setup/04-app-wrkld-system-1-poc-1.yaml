# Step 5: the Application for the cluster. Manual sync: nothing is built until you click SYNC.
# No finalizer: deleting this Application leaves the cluster running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wrkld-system-1-poc-1               # CLUSTER
  namespace: system-1-argocd               # ARGOCD_NS
spec:
  project: vks-clusters
  source:
    repoURL: https://github.com/broadcomryan/vks-bootstrap.git
    targetRevision: main
    path: clusters/wrkld-system-1-poc-1
  destination:
    name: system-1-ns-poc-1                # CLUSTER_NS
    namespace: system-1-ns-poc-1
